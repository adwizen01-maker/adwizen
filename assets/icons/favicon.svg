<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="aw-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#0033AA" />
    </linearGradient>
    <filter id="aw-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="22" fill="#07090E" />
  <rect width="100" height="100" rx="22" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1.5" />
  <!-- Monogram A and W dynamic geometric paths -->
  <g filter="url(#aw-glow)">
    <!-- 'A' element -->
    <path d="M 32 72 L 50 26 L 68 72 L 58 72 L 50 48 L 42 72 Z" fill="url(#aw-grad)" />
    <!-- 'W' geometric overlap -->
    <path d="M 22 42 L 32 72 L 44 42 L 50 56 L 56 42 L 68 72 L 78 42 L 84 42 L 72 80 L 56 80 L 50 66 L 44 80 L 28 80 L 16 42 Z" fill="#00F2FE" opacity="0.9" />
    <!-- Tech core dot -->
    <circle cx="50" cy="38" r="3.5" fill="#FFFFFF" />
  </g>
</svg>
